# @package _global_

# The exact domain randomisation v6 was trained under, lifted from
# logs/DabTracking/20260718_015831-DabTracking_grounded_v6-.../config.yaml.
#
# ASAP fine-tunes with domain randomisation OFF (NO_domain_rand_finetune_with_deltaA)
# on the logic that the delta action model replaces it -- align the simulator to the
# real robot instead of randomising broadly. That produces a policy specialised to
# one physics: our first attempt could not balance in MuJoCo at all, having spent
# 3000 iterations forgetting everything v6 knew about varying friction, gains, mass
# and push disturbances.
#
# Keeping randomisation ON alongside the delta model trades a little of the
# alignment benefit for a policy that still survives a physics it has not seen --
# which is what makes sim2sim a usable safety gate before hardware.
domain_rand:
  push_robots: true
  push_interval_s:
  - 5
  - 10
  max_push_vel_xy: 1.0
  randomize_base_com: true
  base_com_range:
    x:
    - -0.1
    - 0.1
    'y':
    - -0.1
    - 0.1
    z:
    - -0.1
    - 0.1
  randomize_link_mass: true
  link_mass_range:
  - 0.8
  - 1.2
  randomize_pd_gain: true
  kp_range:
  - 0.75
  - 1.25
  kd_range:
  - 0.75
  - 1.25
  randomize_friction: true
  friction_range:
  - 0.5
  - 1.25
  randomize_base_mass: false
  randomize_torque_rfi: true
  rfi_lim: 0.1
  randomize_rfi_lim: true
  rfi_lim_range:
  - 0.5
  - 1.5
  randomize_ctrl_delay: true
  ctrl_delay_step_range:
  - 0
  - 2
